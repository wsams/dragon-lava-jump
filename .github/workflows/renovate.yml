name: Renovate

on:
  schedule:
    # Nightly at 05:27 UTC (offset from the top of the hour to reduce schedule delay).
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Prefer npm registry metadata freshness for "latest" updates.
          RENOVATE_PLATFORM: github
